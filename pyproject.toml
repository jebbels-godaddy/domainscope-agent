[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domainscope-agent"
version = "0.1.0"
description = "DomainScope: public RDAP domain lookup agent with ANS registration, hosted Trust Card with stapled SCITT receipt, A2A + MCP serving"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jeremy Ebbels"}
]
dependencies = [
    "httpx>=0.28",
    "cryptography>=44",
    "a2a-sdk[http-server]>=1.0.2",
    "mcp>=1.2",
    "uvicorn[standard]>=0.34",
    "starlette>=0.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
domainscope-agent = "domainscope_agent.__main__:main"
domainscope-agent-register = "domainscope_agent.register:main"
domainscope-agent-mcp-stdio = "domainscope_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/domainscope_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
